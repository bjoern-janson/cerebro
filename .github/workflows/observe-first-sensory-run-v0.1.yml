name: Observe first sensory run v0.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/observe-first-sensory-run-v0.1.yml

permissions:
  actions: read
  contents: write

jobs:
  observe-existing-run:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: aa09d77d5b27ce4952f7b3b92eb9d3dc48537944
      TARGET_WORKFLOW: first-sensory-event-v0.1.yml
      RESULT_PATH: execution/observability/FIRST_SENSORY_EVENT_RUN_OBSERVATION_AA09D77D.json
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Observe existing run without rerun
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          workflow = os.environ["TARGET_WORKFLOW"]
          result_path = os.environ["RESULT_PATH"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ.get("GITHUB_REF_NAME", "main")

          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "cerebro-first-run-observer-v0.1",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers, method="GET")
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          result = {
              "observer_version": "0.1",
              "target_commit": target_sha,
              "target_workflow": workflow,
              "target_event": "push",
              "query_time_utc": datetime.now(timezone.utc).isoformat(),
              "authority": "execution_observability_only",
              "experiment_mutation_authority": "NONE",
              "rerun_authority": "NONE",
              "bounded_outcome": None,
          }

          try:
              query = urllib.parse.urlencode({
                  "event": "push",
                  "head_sha": target_sha,
                  "per_page": 100,
              })
              runs_url = f"{api}/repos/{repo}/actions/workflows/{workflow}/runs?{query}"
              payload = get_json(runs_url)
              runs = payload.get("workflow_runs", [])
              result["matching_run_count"] = len(runs)

              if len(runs) == 0:
                  result["run_status"] = "RUN_CONFIRMED_NO_EXECUTION"
                  result["run_exists"] = False
              elif len(runs) > 1:
                  result["run_status"] = "RUN_NOT_OBSERVED"
                  result["run_exists"] = None
                  result["reason"] = "MULTIPLE_MATCHING_RUNS"
                  result["matching_run_ids"] = [run.get("id") for run in runs]
              else:
                  run = runs[0]
                  run_id = run["id"]
                  result.update({
                      "run_exists": True,
                      "run_id": run_id,
                      "run_number": run.get("run_number"),
                      "run_attempt_current": run.get("run_attempt"),
                      "run_api_status": run.get("status"),
                      "run_conclusion": run.get("conclusion"),
                      "run_created_at": run.get("created_at"),
                      "run_updated_at": run.get("updated_at"),
                      "run_head_sha": run.get("head_sha"),
                  })

                  jobs_url = f"{api}/repos/{repo}/actions/runs/{run_id}/attempts/1/jobs?per_page=100"
                  jobs_payload = get_json(jobs_url)
                  jobs = jobs_payload.get("jobs", [])
                  candidate_jobs = []
                  for job in jobs:
                      steps = job.get("steps") or []
                      if any(step.get("name") == "Execute frozen first sensory event" for step in steps):
                          candidate_jobs.append(job)

                  if len(candidate_jobs) != 1:
                      result["run_status"] = "RUN_NOT_OBSERVED"
                      result["reason"] = (
                          "EXECUTION_JOB_NOT_IDENTIFIED"
                          if len(candidate_jobs) == 0
                          else "MULTIPLE_EXECUTION_JOBS"
                      )
                      result["candidate_execution_job_count"] = len(candidate_jobs)
                  else:
                      job = candidate_jobs[0]
                      step = next(
                          step for step in job.get("steps", [])
                          if step.get("name") == "Execute frozen first sensory event"
                      )
                      result.update({
                          "first_attempt_job_id": job.get("id"),
                          "first_attempt_job_name": job.get("name"),
                          "first_attempt_job_status": job.get("status"),
                          "first_attempt_job_conclusion": job.get("conclusion"),
                          "adapter_step_status": step.get("status"),
                          "adapter_step_conclusion": step.get("conclusion"),
                          "adapter_step_number": step.get("number"),
                      })

                      if step.get("conclusion") == "skipped":
                          result["run_status"] = "RUN_CONFIRMED_NO_EXECUTION"
                      elif step.get("status") == "completed":
                          result["run_status"] = "RUN_CONFIRMED_EXECUTED"
                          result["bounded_outcome_status"] = "NOT_YET_RECOVERED"
                      else:
                          result["run_status"] = "RUN_CONFIRMED_EXECUTION_STATE_INCOMPLETE"
                          result["bounded_outcome_status"] = "NOT_YET_RECOVERED"

          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, OSError, ValueError) as exc:
              result["run_status"] = "RUN_NOT_OBSERVED"
              result["run_exists"] = None
              result["reason"] = type(exc).__name__

          body = json.dumps(result, indent=2, sort_keys=True) + "\n"
          encoded = base64.b64encode(body.encode("utf-8")).decode("ascii")
          put_payload = json.dumps({
              "message": "Record first sensory run observability v0.1",
              "content": encoded,
              "branch": branch,
          }).encode("utf-8")
          put_headers = dict(headers)
          put_headers["Content-Type"] = "application/json"
          put_url = f"{api}/repos/{repo}/contents/{result_path}"
          request = urllib.request.Request(
              put_url,
              data=put_payload,
              headers=put_headers,
              method="PUT",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 201):
                  raise RuntimeError(f"unexpected result-write status: {response.status}")

          print(result["run_status"])
          PY
